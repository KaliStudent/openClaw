version: '3.8'

services:
  rainmap:
    build: .
    container_name: rainmap
    ports:
      - "8080:8080"
    volumes:
      - ./data/scans:/app/scans
      - ./data/db:/app/db
    environment:
      - ADMIN_USER=admin
      - ADMIN_PASS=admin
      - SECRET_KEY=change-this-to-something-random
      - PORT=8080
    cap_add:
      - NET_RAW      # Required for SYN scans
      - NET_ADMIN    # Required for OS detection
    network_mode: host  # Scan your real network
    restart: unless-stopped
