<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entropic Templates — Choose Your Site</title>
  <link rel="stylesheet" href="../entropic-css/brutal-asphalt.css" id="theme-stylesheet" />
  <style>
    /* ── Layout ── */
    .selector-wrap { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; position: relative; z-index: 10; }
    @media(max-width:900px){ .selector-wrap{grid-template-columns:1fr;} .sidebar{display:none;} }

    /* ── Sidebar ── */
    .sidebar {
      border-right: 1px solid var(--hairline, var(--border));
      padding: 24px 0;
      position: sticky; top: 60px; height: calc(100vh - 60px);
      overflow-y: auto; background: var(--bg);
    }
    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--hairline, var(--border)); }

    .sidebar-section { padding: 0 20px 20px; border-bottom: 1px solid var(--border2, var(--border)); margin-bottom: 4px; }
    .sidebar-label { font-size: 9px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; padding-top: 16px; display: block; }

    /* ── Site type pills ── */
    .type-btn {
      width: 100%; text-align: left; background: transparent;
      border: 1px solid transparent; border-radius: var(--glass-radius, 4px);
      padding: 10px 14px; margin-bottom: 3px; cursor: pointer;
      font-family: var(--body-font); font-size: 12px; font-weight: 600;
      color: var(--text-dim); transition: all var(--transition);
      display: flex; align-items: center; gap: 10px;
    }
    .type-btn .t-icon { font-size: 16px; flex-shrink: 0; }
    .type-btn:hover { color: var(--text); background: rgba(255,255,255,.04); border-color: var(--border2, var(--border)); }
    .type-btn.active { color: var(--lumen, var(--text)); background: var(--primary-tint, rgba(255,255,255,.06)); border-color: var(--fore, var(--primary)); }

    /* ── Theme swatches ── */
    .swatch-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .swatch {
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: all var(--transition);
      position: relative;
    }
    .swatch:hover { transform: scale(1.15); }
    .swatch.active { border-color: var(--lumen, var(--text)); box-shadow: 0 0 0 2px rgba(255,255,255,.2); }
    .swatch[title]:hover::after { content: attr(title); position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%); font-size: 9px; white-space: nowrap; background: var(--panel, var(--surface2)); border: 1px solid var(--hairline, var(--border)); padding: 2px 6px; color: var(--fore); pointer-events: none; z-index: 20; }

    /* ── Variant toggle ── */
    .variant-toggle { display: flex; gap: 0; }
    .var-btn {
      flex: 1; padding: 8px 0; background: transparent; cursor: pointer;
      font-family: var(--body-font); font-size: 11px; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase; color: var(--text-dim);
      border: 1px solid var(--hairline, var(--border)); transition: all var(--transition);
    }
    .var-btn:first-child { border-radius: var(--glass-radius, 2px) 0 0 var(--glass-radius, 2px); }
    .var-btn:last-child  { border-radius: 0 var(--glass-radius, 2px) var(--glass-radius, 2px) 0; border-left: none; }
    .var-btn.active { background: var(--fore, var(--primary)); color: var(--void, #0d0f12); border-color: var(--fore, var(--primary)); }

    /* ── Mode toggle ── */
    .mode-toggle { display: flex; gap: 0; }
    .mode-btn {
      flex: 1; padding: 7px 0; background: transparent; cursor: pointer;
      font-family: var(--body-font); font-size: 11px; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase; color: var(--text-dim);
      border: 1px solid var(--hairline, var(--border)); transition: all var(--transition);
    }
    .mode-btn:first-child { border-radius: var(--glass-radius, 2px) 0 0 var(--glass-radius, 2px); }
    .mode-btn:last-child  { border-radius: 0 var(--glass-radius, 2px) var(--glass-radius, 2px) 0; border-left: none; }
    .mode-btn.active { background: var(--fore, var(--primary)); color: var(--void, #0d0f12); border-color: var(--fore, var(--primary)); }

    /* ── Main preview area ── */
    .preview-area { display: flex; flex-direction: column; }

    /* ── Preview header bar ── */
    .preview-bar {
      height: 52px; border-bottom: 1px solid var(--hairline, var(--border));
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; background: var(--bg); gap: 16px; flex-shrink: 0;
      position: sticky; top: 60px; z-index: 50;
    }
    .preview-bar .site-name { font-family: var(--display-font); font-size: 13px; font-weight: 800; color: var(--lumen, var(--text)); letter-spacing: .04em; }
    .preview-bar .css-name { font-size: 10px; color: var(--muted); font-family: var(--body-font); }
    .device-btns { display: flex; gap: 4px; }
    .device-btn { padding: 5px 10px; background: transparent; border: 1px solid var(--hairline, var(--border)); color: var(--muted); font-family: var(--body-font); font-size: 11px; cursor: pointer; transition: all var(--transition); }
    .device-btn.active { border-color: var(--fore, var(--primary)); color: var(--lumen, var(--text)); }

    /* ── Iframe container ── */
    .iframe-wrap {
      flex: 1; padding: 24px; background: var(--surface, var(--panel));
      display: flex; align-items: flex-start; justify-content: center;
      min-height: calc(100vh - 60px - 52px);
    }
    .iframe-shell {
      width: 100%; max-width: 1200px;
      border: 1px solid var(--hairline, var(--border));
      border-radius: var(--glass-radius, 4px);
      overflow: hidden;
      transition: max-width .35s cubic-bezier(.25,.46,.45,.94);
      box-shadow: 0 8px 40px rgba(0,0,0,.4);
    }
    .iframe-shell.tablet  { max-width: 768px; }
    .iframe-shell.mobile  { max-width: 375px; }
    .iframe-shell iframe  { width: 100%; height: 80vh; min-height: 600px; border: none; display: block; }

    /* ── Page links ── */
    .page-pills { display: flex; gap: 4px; flex-wrap: wrap; }
    .page-pill {
      padding: 4px 10px; border: 1px solid var(--hairline, var(--border));
      background: transparent; font-family: var(--body-font); font-size: 10px;
      font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted); cursor: pointer; transition: all var(--transition);
      border-radius: 2px;
    }
    .page-pill:hover { border-color: var(--fore, var(--primary)); color: var(--text); }
    .page-pill.active { border-color: var(--fore, var(--primary)); color: var(--lumen, var(--text)); background: var(--primary-tint); }

    /* ── Purchase panel ── */
    .purchase-panel {
      border-top: 1px solid var(--hairline, var(--border));
      padding: 20px 24px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 20px; flex-wrap: wrap; background: var(--bg);
    }
    .purchase-info { display: flex; flex-direction: column; gap: 4px; }
    .purchase-title { font-size: 14px; font-weight: 700; color: var(--lumen, var(--text)); }
    .purchase-sub { font-size: 12px; color: var(--muted); }
    .purchase-actions { display: flex; gap: 10px; align-items: center; }
    .purchase-price { font-family: var(--display-font); font-size: 24px; font-weight: 900; color: var(--lumen, var(--text)); }

    /* ── Loader ── */
    .iframe-loader {
      position: absolute; inset: 0; background: var(--surface, var(--panel));
      display: flex; align-items: center; justify-content: center;
      z-index: 5; pointer-events: none; opacity: 0; transition: opacity .2s;
    }
    .iframe-loader.show { opacity: 1; pointer-events: all; }
    .spinner { width: 24px; height: 24px; border: 2px solid var(--hairline, var(--border)); border-top-color: var(--fore, var(--primary)); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Mobile sidebar overlay ── */
    .mobile-filter-btn { display: none; }
    @media(max-width:900px) {
      .mobile-filter-btn { display: flex; align-items: center; gap: 8px; }
      .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 400; }
      .sidebar-overlay.open { display: block; }
      .sidebar-mobile { position: fixed; left: 0; top: 0; bottom: 0; width: 280px; background: var(--bg); border-right: 1px solid var(--hairline, var(--border)); z-index: 401; transform: translateX(-100%); transition: transform .3s; padding: 24px 0; overflow-y: auto; }
      .sidebar-mobile.open { transform: translateX(0); }
    }

    /* ── Active selector indicator ── */
    .active-combo {
      font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--fore, var(--primary)); display: flex; align-items: center; gap: 6px;
    }
    .active-combo .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--fore, var(--primary)); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  </style>
</head>
<body>

<!-- Background -->
<div style="position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;">
  <div style="position:absolute;width:600px;height:600px;background:radial-gradient(circle,var(--orb1) 0%,transparent 70%);filter:blur(70px);top:-10%;left:-5%;border-radius:50%;"></div>
  <div style="position:absolute;width:500px;height:500px;background:radial-gradient(circle,var(--orb2) 0%,transparent 70%);filter:blur(60px);bottom:5%;right:-5%;border-radius:50%;"></div>
  <div class="noise"></div>
</div>

<!-- Mobile sidebar overlay -->
<div class="sidebar-overlay" id="mob-overlay" onclick="closeMobileSidebar()"></div>
<div class="sidebar-mobile" id="mob-sidebar">
  <div style="padding:0 20px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--hairline,var(--border));margin-bottom:8px;">
    <span style="font-family:var(--display-font);font-size:13px;font-weight:800;color:var(--lumen,var(--text));">FILTER</span>
    <button onclick="closeMobileSidebar()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;">✕</button>
  </div>
  <div id="mob-sidebar-content"></div>
</div>

<!-- Top nav -->
<nav class="nav">
  <a href="#" class="nav-logo">ENTROPIC<span style="color:var(--muted);">TEMPLATES</span></a>
  <div style="display:flex;align-items:center;gap:8px;">
    <span class="active-combo" id="active-label">
      <span class="dot"></span>
      <span id="active-label-text">Domain Registrar · Asphalt · Brutal · Dark</span>
    </span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <button class="mobile-filter-btn btn btn-ghost" style="font-size:11px;padding:7px 14px;" onclick="openMobileSidebar()">⚙ Filter</button>
    <a href="#purchase" class="btn btn-primary" style="font-size:11px;padding:7px 16px;" onclick="scrollToPurchase()">Get This Template</a>
  </div>
</nav>

<!-- Main layout -->
<div class="selector-wrap">

  <!-- Sidebar -->
  <aside class="sidebar" id="main-sidebar">
    <div id="sidebar-inner"><!-- populated by JS --></div>
  </aside>

  <!-- Preview -->
  <div class="preview-area">

    <!-- Preview bar -->
    <div class="preview-bar">
      <div>
        <div class="site-name" id="pb-name">Domain Registrar</div>
        <div class="css-name" id="pb-css">brutal-asphalt.css</div>
      </div>
      <div class="page-pills" id="page-pills"></div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="device-btns">
          <button class="device-btn active" onclick="setDevice('desktop',this)" title="Desktop">🖥</button>
          <button class="device-btn" onclick="setDevice('tablet',this)" title="Tablet">📱</button>
          <button class="device-btn" onclick="setDevice('mobile',this)" title="Mobile">📲</button>
        </div>
        <button onclick="openInNewTab()" style="background:none;border:1px solid var(--hairline,var(--border));color:var(--muted);cursor:pointer;font-size:11px;padding:5px 10px;font-family:var(--body-font);transition:all var(--transition);" onmouseover="this.style.borderColor='var(--fore)';this.style.color='var(--text)'" onmouseout="this.style.borderColor='';this.style.color=''">↗ Open</button>
      </div>
    </div>

    <!-- Iframe -->
    <div class="iframe-wrap">
      <div class="iframe-shell" id="iframe-shell" style="position:relative;">
        <div class="iframe-loader" id="loader"><div class="spinner"></div></div>
        <iframe id="preview-frame" src="" title="Template Preview" onload="hideLoader()"></iframe>
      </div>
    </div>

    <!-- Purchase panel -->
    <div class="purchase-panel" id="purchase">
      <div class="purchase-info">
        <div class="purchase-title" id="pp-title">Domain Registrar Template</div>
        <div class="purchase-sub" id="pp-sub">Asphalt · Brutal · Dark · 7 pages included</div>
      </div>
      <div class="purchase-actions">
        <div class="purchase-price" id="pp-price">$49</div>
        <a href="#" class="btn btn-ghost" style="font-size:12px;padding:10px 20px;" onclick="previewFullscreen()">Full Preview</a>
        <button class="btn btn-primary" style="font-size:13px;padding:12px 28px;" onclick="purchaseTemplate()">Buy &amp; Deploy →</button>
      </div>
    </div>

  </div>
</div>

<script>
/* ══════════════════════════════════════════════════
   DATA
══════════════════════════════════════════════════ */
const TEMPLATES = [
  {
    id: 'domain-registrar',
    name: 'Domain Registrar',
    icon: '🌐',
    desc: 'Full domain registration site with search, pricing table, TLD grid, and site launch upsell.',
    price: 79,
    pages: ['index','pricing','faq','about','contact','privacy','terms'],
    pageLabels: ['Home','Pricing','FAQ','About','Contact','Privacy','Terms'],
  },
  {
    id: 'landing',
    name: 'Landing Page',
    icon: '🚀',
    desc: 'High-converting single-product or SaaS landing page with hero, features, testimonials, and CTA.',
    price: 49,
    pages: ['index','contact','privacy','terms'],
    pageLabels: ['Home','Contact','Privacy','Terms'],
  },
  {
    id: 'blog',
    name: 'Blog',
    icon: '✍️',
    desc: 'Publication-grade blog with post listing, single post, sidebar, newsletter subscribe, and about page.',
    price: 49,
    pages: ['index','post','about','contact','privacy','terms'],
    pageLabels: ['Posts','Article','About','Contact','Privacy','Terms'],
  },
  {
    id: 'small-business',
    name: 'Small Business',
    icon: '🏪',
    desc: 'Local service business site with services grid, hours, reviews, map placeholder, and FAQ.',
    price: 49,
    pages: ['index','about','faq','contact','privacy','terms'],
    pageLabels: ['Home','About','FAQ','Contact','Privacy','Terms'],
  },
  {
    id: 'product-pricing',
    name: 'Product + Pricing',
    icon: '💼',
    desc: 'SaaS product page with feature showcase, monthly/annual pricing toggle, comparison table, and FAQ.',
    price: 59,
    pages: ['index','faq','contact','privacy','terms'],
    pageLabels: ['Product','FAQ','Contact','Privacy','Terms'],
  },
  {
    id: 'company-profile',
    name: 'Company Profile',
    icon: '🏢',
    desc: 'Corporate profile with mission, team cards, timeline, values, open positions, and press kit.',
    price: 49,
    pages: ['index','contact','privacy','terms'],
    pageLabels: ['Company','Contact','Privacy','Terms'],
  },
  {
    id: 'ecommerce',
    name: 'Ecommerce',
    icon: '🛒',
    desc: 'Product listing with cart drawer, filters, search, sort, and Stripe + PayPal checkout stubs.',
    price: 99,
    pages: ['index','faq','contact','privacy','terms'],
    pageLabels: ['Shop','FAQ','Contact','Privacy','Terms'],
  },
];

const THEMES = [
  { id: 'asphalt',  label: 'Asphalt',  dark: '#1a1d22', light: '#e8ebef' },
  { id: 'cobalt',   label: 'Cobalt',   dark: '#0a1628', light: '#e8f0fe' },
  { id: 'entropic', label: 'Entropic', dark: '#0d0d1a', light: '#f0f0ff' },
  { id: 'cherry',   label: 'Cherry',   dark: '#1a0a10', light: '#fff0f3' },
  { id: 'jungle',   label: 'Jungle',   dark: '#0a1a0a', light: '#f0fff0' },
  { id: 'solar',    label: 'Solar',    dark: '#1a1500', light: '#fffbf0' },
];

const VARIANTS = ['brutal', 'minimal'];
const MODES    = ['dark', 'light'];

/* ══════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════ */
let state = {
  template: 'domain-registrar',
  theme:    'asphalt',
  variant:  'brutal',
  mode:     'dark',
  page:     'index',
};

/* ══════════════════════════════════════════════════
   RENDER SIDEBAR
══════════════════════════════════════════════════ */
function sidebarHTML() {
  return `
    <div class="sidebar-section">
      <span class="sidebar-label">Site Type</span>
      ${TEMPLATES.map(t => `
        <button class="type-btn ${state.template === t.id ? 'active' : ''}"
          onclick="setState('template','${t.id}')">
          <span class="t-icon">${t.icon}</span>
          <span>${t.name}</span>
        </button>
      `).join('')}
    </div>
    <div class="sidebar-section">
      <span class="sidebar-label">Theme</span>
      <div class="swatch-row">
        ${THEMES.map(th => `
          <div class="swatch ${state.theme === th.id ? 'active' : ''}"
            style="background: ${state.mode === 'dark' ? th.dark : th.light}; border-color: ${state.theme === th.id ? '#fff' : 'transparent'};"
            title="${th.label}"
            onclick="setState('theme','${th.id}')">
          </div>
        `).join('')}
      </div>
      <div style="margin-top:10px;font-size:11px;font-weight:700;color:var(--fore,var(--primary));">
        ${THEMES.find(t=>t.id===state.theme)?.label || ''}
      </div>
    </div>
    <div class="sidebar-section">
      <span class="sidebar-label">Style Variant</span>
      <div class="variant-toggle">
        <button class="var-btn ${state.variant==='brutal'?'active':''}" onclick="setState('variant','brutal')">Brutal</button>
        <button class="var-btn ${state.variant==='minimal'?'active':''}" onclick="setState('variant','minimal')">Minimal</button>
      </div>
    </div>
    <div class="sidebar-section">
      <span class="sidebar-label">Mode</span>
      <div class="mode-toggle">
        <button class="mode-btn ${state.mode==='dark'?'active':''}" onclick="setState('mode','dark')">🌑 Dark</button>
        <button class="mode-btn ${state.mode==='light'?'active':''}" onclick="setState('mode','light')">☀ Light</button>
      </div>
    </div>
    <div style="padding:20px;">
      <div style="font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;">Current Selection</div>
      <div style="font-size:11px;color:var(--text-dim);line-height:1.8;">
        <div>Site: <strong style="color:var(--fore,var(--primary));">${TEMPLATES.find(t=>t.id===state.template)?.name}</strong></div>
        <div>Theme: <strong style="color:var(--fore,var(--primary));">${THEMES.find(t=>t.id===state.theme)?.label}</strong></div>
        <div>Style: <strong style="color:var(--fore,var(--primary));">${state.variant.charAt(0).toUpperCase()+state.variant.slice(1)}</strong></div>
        <div>Mode: <strong style="color:var(--fore,var(--primary));">${state.mode.charAt(0).toUpperCase()+state.mode.slice(1)}</strong></div>
      </div>
    </div>
  `;
}

/* ══════════════════════════════════════════════════
   COMPUTED VALUES
══════════════════════════════════════════════════ */
function cssFile()      { return `${state.variant}-${state.theme}.css`; }
function templatePath() {
  const t = TEMPLATES.find(x => x.id === state.template);
  const page = t.pages.includes(state.page) ? state.page : t.pages[0];
  return `./${state.template}/${page}.html`;
}

/* ══════════════════════════════════════════════════
   STATE UPDATE — single entry point
══════════════════════════════════════════════════ */
function setState(key, val) {
  state[key] = val;
  // If template changed, reset page to first
  if (key === 'template') state.page = TEMPLATES.find(t=>t.id===val).pages[0];
  render();
}

/* ══════════════════════════════════════════════════
   RENDER — updates all UI without full reload
══════════════════════════════════════════════════ */
function render() {
  const t    = TEMPLATES.find(x => x.id === state.template);
  const css  = cssFile();
  const path = templatePath();

  // Sidebar
  document.getElementById('sidebar-inner').innerHTML   = sidebarHTML();
  document.getElementById('mob-sidebar-content').innerHTML = sidebarHTML();

  // Preview bar
  document.getElementById('pb-name').textContent = t.name;
  document.getElementById('pb-css').textContent  = css;

  // Active label
  document.getElementById('active-label-text').textContent =
    `${t.name} · ${THEMES.find(x=>x.id===state.theme)?.label} · ${state.variant.charAt(0).toUpperCase()+state.variant.slice(1)} · ${state.mode.charAt(0).toUpperCase()+state.mode.slice(1)}`;

  // Page pills
  document.getElementById('page-pills').innerHTML = t.pages.map((pg, i) => `
    <button class="page-pill ${state.page === pg ? 'active' : ''}"
      onclick="setState('page','${pg}')">${t.pageLabels[i]}</button>
  `).join('');

  // Purchase panel
  document.getElementById('pp-title').textContent = `${t.name} Template`;
  document.getElementById('pp-sub').textContent   = `${THEMES.find(x=>x.id===state.theme)?.label} · ${state.variant.charAt(0).toUpperCase()+state.variant.slice(1)} · ${state.mode.charAt(0).toUpperCase()+state.mode.slice(1)} · ${t.pages.length} pages included`;
  document.getElementById('pp-price').textContent = `$${t.price}`;

  // Stylesheet on top nav (self-theming)
  document.getElementById('theme-stylesheet').href = `../entropic-css/${css}`;
  if (state.mode === 'light') document.body.classList.add('theme-light');
  else document.body.classList.remove('theme-light');

  // Load iframe
  loadPreview(path, css);
}

/* ══════════════════════════════════════════════════
   IFRAME LOADING
══════════════════════════════════════════════════ */
let loadTimer = null;
function loadPreview(path, css) {
  showLoader();
  clearTimeout(loadTimer);
  loadTimer = setTimeout(() => {
    const iframe = document.getElementById('preview-frame');
    // Pass theme and mode as query params — page reads them to self-configure
    iframe.src = `${path}?css=${encodeURIComponent(css)}&mode=${state.mode}`;
  }, 120); // debounce rapid clicks
}

function showLoader() { document.getElementById('loader').classList.add('show'); }
function hideLoader() {
  document.getElementById('loader').classList.remove('show');
  // Inject theme into iframe after load
  try {
    const iframe = document.getElementById('preview-frame');
    const doc    = iframe.contentDocument || iframe.contentWindow.document;
    const link   = doc.getElementById('theme-stylesheet');
    if (link) link.href = `../../entropic-css/${cssFile()}`;
    if (state.mode === 'light') doc.body.classList.add('theme-light');
    else doc.body.classList.remove('theme-light');
    // Hide the theme-bar inside the preview (it's in the selector now)
    const bar = doc.querySelector('.theme-bar');
    if (bar) bar.style.display = 'none';
  } catch(e) { /* cross-origin — ignore */ }
}

/* ══════════════════════════════════════════════════
   DEVICE SWITCHING
══════════════════════════════════════════════════ */
function setDevice(size, btn) {
  const shell = document.getElementById('iframe-shell');
  shell.classList.remove('tablet','mobile');
  if (size === 'tablet') shell.classList.add('tablet');
  if (size === 'mobile') shell.classList.add('mobile');
  document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

/* ══════════════════════════════════════════════════
   ACTIONS
══════════════════════════════════════════════════ */
function openInNewTab() {
  window.open(templatePath(), '_blank');
}
function previewFullscreen() {
  window.open(templatePath(), '_blank');
}
function scrollToPurchase() {
  document.getElementById('purchase').scrollIntoView({ behavior: 'smooth' });
}

  const t = TEMPLATES.find(x => x.id === state.template);
  // ═══ PURCHASE HOOK ═══════════════════════════════════

/* ══════════════════════════════════════════════════
   MOBILE SIDEBAR
══════════════════════════════════════════════════ */
function openMobileSidebar() {
  document.getElementById('mob-sidebar').classList.add('open');
  document.getElementById('mob-overlay').classList.add('open');
}
function closeMobileSidebar() {
  document.getElementById('mob-sidebar').classList.remove('open');
  document.getElementById('mob-overlay').classList.remove('open');
}

/* ══════════════════════════════════════════════════
   KEYBOARD SHORTCUTS
══════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'd') setState('mode', state.mode === 'dark' ? 'light' : 'dark');
  if (e.key === 'b') setState('variant', 'brutal');
  if (e.key === 'm') setState('variant', 'minimal');
  if (e.key === 'ArrowRight') {
    const idx = TEMPLATES.findIndex(t => t.id === state.template);
    if (idx < TEMPLATES.length - 1) setState('template', TEMPLATES[idx+1].id);
  }
  if (e.key === 'ArrowLeft') {
    const idx = TEMPLATES.findIndex(t => t.id === state.template);
    if (idx > 0) setState('template', TEMPLATES[idx-1].id);
  }
});

/* ══════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════ */
render();
</script>
