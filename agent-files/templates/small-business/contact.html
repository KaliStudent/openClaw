<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Contact — </title><link rel="stylesheet" href="../../entropic-css/brutal-asphalt.css" id="theme-stylesheet"/></head>
<body>
<div style="position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;"><div style="position:absolute;width:500px;height:500px;background:radial-gradient(circle,var(--orb1) 0%,transparent 70%);filter:blur(60px);top:-5%;right:5%;border-radius:50%;"></div><div class="noise"></div><div class="entropic-grid" style="position:absolute;inset:0;"></div></div>
<nav class="nav"><a href="index.html" class="nav-logo"></a><ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="contact.html" class="active">Contact</a></li></ul><a href="index.html" class="btn btn-primary" style="font-size:11px;padding:7px 16px;"></a></nav>
<main style="position:relative;z-index:10;">
  <div class="section" style="max-width:800px;">
    <p class="section-eyebrow">Get In Touch</p>
    <h1 class="section-title">Contact Us</h1>
    <p class="section-sub" style="margin-bottom:48px;">We'll get back to you within one business day.</p>
    <div style="display:grid;grid-template-columns:1fr 1.5fr;gap:1px;">
      <div style="display:flex;flex-direction:column;gap:1px;">
        <div class="glass" style="padding:28px 24px;"><div style="font-size:20px;margin-bottom:10px;">📧</div><div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;">Email</div><a href="mailto:hello@yourbrand.com" style="font-size:13px;color:var(--lumen,var(--text));">hello@yourbrand.com</a></div>
        <div class="glass" style="padding:28px 24px;"><div style="font-size:20px;margin-bottom:10px;">⏱</div><div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;">Response Time</div><p style="font-size:13px;">Within 1 business day.</p></div>
      </div>
      <div class="glass" style="padding:36px 32px;">
        <form style="display:flex;flex-direction:column;gap:18px;" onsubmit="this.querySelector('#ok').style.display='block';this.reset();event.preventDefault();">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;"><div class="field"><label>Name</label><input type="text" required/></div><div class="field"><label>Email</label><input type="email" required/></div></div>
          <div class="field"><label>Subject</label><input type="text" required/></div>
          <div class="field"><label>Message</label><textarea rows="5" required style="resize:vertical;min-height:110px;"></textarea></div>
          <div id="ok" style="display:none;padding:12px;border:1px solid rgba(74,222,128,0.3);background:rgba(74,222,128,0.06);font-size:13px;color:#4ade80;">✓ Sent!</div>
          <button type="submit" class="btn btn-primary" style="width:100%;padding:13px;">Send Message</button>
        </form>
      </div>
    </div>
  </div>
</main>
<footer class="footer" style="position:relative;z-index:10;"><div style="max-width:800px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;"><span>© 2026 </span><div style="display:flex;gap:16px;"><a href="privacy.html" style="font-size:11px;color:var(--muted);">Privacy</a><a href="terms.html" style="font-size:11px;color:var(--muted);">Terms</a></div></div></footer>
</body></html>
