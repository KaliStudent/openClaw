<html>
<head>

<style>



/* From Uiverse.io by joe-watson-sbf */ 
.container {
  color: white;
  position: relative;
  font-family: Orbitron;
  font-size: 48;
}

divrect{
  font-size: 2px;
}
.container::before,
.container::after {
  content: "";
  background-color: #8b43e84c;
  position: absolute;
}

.container::before {
  border-radius: 50%;
  width: 6rem;
  height: 6rem;
  top: 30%;
  right: 7%;
}

.container::after {
  content: "";
  position: absolute;
  height: 3rem;
  top: 8%;
  right: 5%;
  border: 1px solid;
}

.container .rect {
  width: 21em;
  height: 25em;
  padding: 1rem;
  background-color: rgba(255, 255, 255, 0.074);
  border: 1px solid rgba(255, 255, 255, 0.222);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  border-radius: 0.7rem;
  transition: all ease 0.3s;
}

.container .rect {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.container .rect .title {
  font-size: 2rem;
  font-weight: 500;
  letter-spacing: 0.1em;
}

.container .rect div strong {
  display: block;
  margin-bottom: 0.5rem;
}

.container .rect div p {
  margin: 0;
  font-size: 0.9em;
  font-weight: 300;
  letter-spacing: 0.1em;
}

.container .rect div span {
  font-size: 0.7rem;
  font-weight: 300;
}

.container .rect div span:nth-child(3) {
  font-weight: 500;
  margin-right: 0.2rem;
}

.container .rect:hover {
  box-shadow: 0px 0px 20px 1px #0549f53f;
  border: 1px solid rgba(0, 157, 255, 0.9);
}

</style>


</head>

<body>


<div class="container">
  <div class="rect">
    <span class="title">GLASS EFFECT</span>
    <div>
      <strong>JOE WATSON SBF</strong>
      <p>0000 000 000 0000</p>
      <span>VALID</span> <span>01/28</span>
    </div>
  </div>
</div>


</body>
</html>
